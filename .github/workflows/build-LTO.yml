name: Build NetHunter Kernel (POCO F5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Maximize Swap Space for LTO
      run: |
        sudo swapoff -a
        sudo fallocate -l 16G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        path: kernel/msm-5.10

    - name: Install Ubuntu 24.04 Clang 18.1.3 and Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex git libssl-dev \
          libelf-dev python3 python-is-python3 libncurses-dev cpio lz4 \
          device-tree-compiler zip kmod pahole rsync clang-18 lld-18 llvm-18 \
          clang lld llvm binutils-aarch64-linux-gnu

    - name: Prepare Exact Phone Config and Build
      env:
        KCFLAGS: "-w"
        HOSTCFLAGS: "-w"
      run: |
        cd kernel/msm-5.10
        mkdir -p out
        echo "" >> Makefile

        sed -i '/select MT76_LEDS/d' drivers/net/wireless/mediatek/mt76/Kconfig
        sed -i 's/default y/default n/g' drivers/net/wireless/mediatek/mt76/Kconfig
        sed -i 's/default y/default n/g' drivers/net/wireless/ath/carl9170/Kconfig
        sed -i 's/default y/default n/g' drivers/net/wireless/ralink/rt2x00/Kconfig
        sed -i 's/default y/default n/g' drivers/net/wireless/realtek/rtl818x/rtl8187/Kconfig
        sed -i '/select MAC80211_LEDS/d' nethunter/Kconfig

        if [ -f author_config.txt ]; then
          cp author_config.txt out/.config
        elif [ -f author_config ]; then
          cp author_config out/.config
        else
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/waipio_GKI.config \
            arch/arm64/configs/vendor/xiaomi_GKI.config \
            arch/arm64/configs/vendor/addon.config \
            arch/arm64/configs/vendor/marble_GKI.config
        fi

        cat << 'EOF' > out/mt76_override.config
        CONFIG_WERROR=n
        CONFIG_SECURITY_SELINUX=y
        CONFIG_SECURITY_SELINUX_DEVELOP=y
        CONFIG_SECURITY_SELINUX_AVC_STATS=y
        CONFIG_DEFAULT_SECURITY_SELINUX=y
        CONFIG_DEFAULT_SECURITY_DAC=n
        CONFIG_AUDIT=y
        CONFIG_AUDITSYSCALL=y
        CONFIG_INTEGRITY_AUDIT=y
        CONFIG_NETWORK_SECMARK=y
        CONFIG_NF_CONNTRACK_SECMARK=y
        CONFIG_NETFILTER_XT_TARGET_CONNSECMARK=y
        CONFIG_NETFILTER_XT_TARGET_SECMARK=y
        CONFIG_LSM="lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf"
        CONFIG_CFI_CLANG=y
        CONFIG_CFI_CLANG_SHADOW=y
        CONFIG_MAC80211_LEDS=n
        CONFIG_CARL9170_LEDS=n
        CONFIG_RT2X00_LIB_LEDS=n
        CONFIG_RTL8187_LEDS=n
        CONFIG_WLAN_VENDOR_MEDIATEK=y
        CONFIG_MT7601U=m
        CONFIG_MT76_CORE=m
        CONFIG_MT76_LEDS=n
        CONFIG_MT76_USB=m
        CONFIG_MT76x02_LIB=m
        CONFIG_MT76x02_USB=m
        CONFIG_MT76x2_COMMON=m
        CONFIG_MT76x2U=m
        EOF

        scripts/kconfig/merge_config.sh -m -O out out/.config out/mt76_override.config

        make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

        grep -E "MT76|MAC80211_LEDS|CARL9170_LEDS|RT2X00_LIB_LEDS|RTL8187_LEDS" out/.config

        make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- Image modules

        rm -rf out/modules
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH=modules INSTALL_MOD_STRIP=1 modules_install

    - name: Collect GKI2 Deliverables
      run: |
        mkdir -p ${{ github.workspace }}/NETHUNTER_RELEASE/system
        cp kernel/msm-5.10/out/arch/arm64/boot/Image ${{ github.workspace }}/NETHUNTER_RELEASE/
        cp kernel/msm-5.10/out/.config ${{ github.workspace }}/NETHUNTER_RELEASE/config.txt
        rm -rf kernel/msm-5.10/out/modules/lib/modules/*/build
        rm -rf kernel/msm-5.10/out/modules/lib/modules/*/source
        cp -r kernel/msm-5.10/out/modules/lib ${{ github.workspace }}/NETHUNTER_RELEASE/system/

    - name: Upload NetHunter Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-PocoF5-MT7612U-Clean
        path: ${{ github.workspace }}/NETHUNTER_RELEASE/
