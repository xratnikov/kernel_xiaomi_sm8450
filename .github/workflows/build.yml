name: Build NetHunter Kernel (POCO F5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        path: kernel/msm-5.10

    - name: Install Build Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex git libssl-dev \
          libelf-dev python3 python-is-python3 libncurses-dev cpio lz4 \
          device-tree-compiler zip kmod pahole rsync

    - name: Download Toolchain and Tools
      env:
        DOM: "https://android.googlesource.com"
      run: |
        mkdir -p prebuilts-master/clang/host/linux-x86
        mkdir -p prebuilts/kernel-build-tools
        
        git clone --depth=1 -b master-kernel-build-2021 "${{ env.DOM }}/platform/prebuilts/clang/host/linux-x86" prebuilts-master/clang/host/linux-x86/clang-r416183b
        git clone --depth=1 -b master-kernel-build-2021 "${{ env.DOM }}/kernel/prebuilts/build-tools" prebuilts/kernel-build-tools/linux-x86
        
    - name: Compile NetHunter Kernel
      env:
        KCFLAGS: "-w"
      run: |
        cd kernel/msm-5.10
        chmod +x build.sh
        ./build.sh --no-lto marble

    - name: Collect GKI2 Modules
      run: |
        mkdir -p ${{ github.workspace }}/NETHUNTER_RELEASE/NetKernel-modules_ADDONS
        
        cp kernel/msm-5.10/Image ${{ github.workspace }}/NETHUNTER_RELEASE/
        
        cp kernel/msm-5.10/out/.config ${{ github.workspace }}/NETHUNTER_RELEASE/config.txt
        
        find kernel/msm-5.10/out/modules/ -name "*mt76*.ko" -exec cp {} ${{ github.workspace }}/NETHUNTER_RELEASE/NetKernel-modules_ADDONS/ \;

    - name: Upload NetHunter Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-PocoF5-MT7612U
        path: ${{ github.workspace }}/NETHUNTER_RELEASE/
